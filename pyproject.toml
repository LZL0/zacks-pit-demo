[project]
name = "pitdemo"
version = "0.1.0"
description = "Point-in-time analyst consensus with per-estimate split adjustment, served over HTTP and MCP."
authors = [{ name = "LZL0", email = "12474488+LZL0@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pyarrow>=20",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
demo = "pitdemo.cli:app"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sdk/python/pitdemo_sdk/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT"]
ignore = [
    "DTZ001", # naive datetimes are deliberate: every timestamp in this repo is UTC
    "DTZ007",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandera.*", "duckdb.*", "matplotlib.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# Matplotlib's stubs reject dates on date axes, which is the documented usage.
module = ["pitdemo.chart"]
disable_error_code = ["arg-type", "no-untyped-call"]

name: API reference (GitHub Pages)

# Publishes site/index.html plus the committed openapi.json as the API reference at
# https://lzl0.github.io/zacks-pit-demo/. openapi.json is generated from the code and
# checked for drift in CI, so the published reference always matches main.

on:
  push:
    branches: [main]
    paths: [openapi.json, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp openapi.json _site/
          python3 -c "import json; json.load(open('_site/openapi.json'))"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

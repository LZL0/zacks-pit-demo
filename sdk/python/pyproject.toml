[project]
name = "pitdemo-sdk"
version = "0.1.0"
description = "Typed Python client for the point-in-time consensus demo API (models generated from sdk/schema.json)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "polars>=1.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
